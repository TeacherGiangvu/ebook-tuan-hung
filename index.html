<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ebook tự học 4 tuần cho Tuấn Hưng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: sidebar of weeks on the left, one lesson page at a time on the right; stacks to a top strip on phones. */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#14201F; --muted:#52625F; --line:#D5DFDC;
  --accent:#0E6B73; --accent-ink:#FFFFFF; --accent-soft:#DFF0F0;
  --speak:#4B3FA8; --speak-soft:#ECEAFB;
  --good:#17703F; --good-soft:#DFF3E7; --bad:#B3261E; --bad-soft:#FBE5E3; --warn-soft:#FFF2D6; --warn:#7A4F00;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1514; --surface:#152120; --ink:#E5EEEC; --muted:#9BAFAB; --line:#294240;
    --accent:#52C4CD; --accent-ink:#06201F; --accent-soft:#12302F;
    --speak:#ADA4F7; --speak-soft:#211E45;
    --good:#62D494; --good-soft:#12301F; --bad:#FF8E85; --bad-soft:#3A1816; --warn-soft:#33270B; --warn:#F0C36B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#152120; --ink:#E5EEEC; --muted:#9BAFAB; --line:#294240;
  --accent:#52C4CD; --accent-ink:#06201F; --accent-soft:#12302F;
  --speak:#ADA4F7; --speak-soft:#211E45;
  --good:#62D494; --good-soft:#12301F; --bad:#FF8E85; --bad-soft:#3A1816; --warn-soft:#33270B; --warn:#F0C36B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
nav.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.brand{font:700 20px/1.2 var(--font-display);margin:0 0 10px}
.brand small{display:block;font:600 12px var(--font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
nav.side a{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;border:1px solid transparent}
nav.side a:hover{background:var(--accent-soft)}
nav.side a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.side a b{font-weight:700}
nav.side a span{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
nav.side a small{grid-column:1/-1;font-size:12.5px;opacity:.8;line-height:1.3}
.bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
nav.side a[aria-current="page"] .bar{background:rgba(255,255,255,.35)}
main{min-width:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.5vw,40px);letter-spacing:-.01em}
h2{font-size:24px;margin-bottom:12px}
h3{font-size:18px;margin-bottom:10px}
.eyebrow{font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.lede{font-size:18px;color:var(--muted);max-width:62ch;margin:10px 0 0}
.hero{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.goals{margin:16px 0 0;padding-left:20px}
.goals li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.s{background:var(--speak-soft);color:var(--speak)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:14px 0}
details.day>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary .dn{font:700 13px var(--font-body);color:var(--accent);letter-spacing:.06em;text-transform:uppercase;min-width:54px}
details.day>summary .dt{font:700 18px var(--font-display);flex:1 1 220px}
details.day>summary .dm{font-size:13px;color:var(--muted)}
details.day>summary .ok{display:none;font-size:13px;font-weight:700;color:var(--good)}
details.day.done>summary .ok{display:inline}
details.day[open]>summary{border-bottom:1px solid var(--line)}
.daybody{padding:6px 18px 18px}
.block{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.block.note{background:var(--accent-soft);border-color:transparent}
.block.speak{background:var(--speak-soft);border-color:transparent}
.block h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.block .intro{margin:0 0 10px;color:var(--muted)}
.block p{margin:8px 0}
.block ul,.block ol{margin:8px 0;padding-left:22px}
.block li{margin:5px 0}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface);font-weight:700}
.block.vocab .en{font-weight:700}
.hide-vi .vi{color:transparent;background:var(--line);border-radius:4px;user-select:none}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:0 0 8px}
.eg{color:var(--muted);font-size:14.5px}
.ex ol{list-style:decimal;padding-left:26px}
.ex li{padding:6px 0}
input.gap{font:inherit;width:9.5em;max-width:100%;padding:3px 8px;margin:0 3px;border:none;border-bottom:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:4px 4px 0 0}
input.gap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.gap.ok{border-bottom-color:var(--good);background:var(--good-soft)}
input.gap.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.fb{display:block;font-size:14px;margin-top:2px}
.fb.bad{color:var(--bad)}
.fb.ok{color:var(--good)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{font:700 14px var(--font-body);padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn.rec{background:var(--speak);border-color:var(--speak);color:#fff}
.btn.rec.on{background:var(--bad);border-color:var(--bad)}
.btn:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{font-weight:700}
.score.pass{color:var(--good)}
.score.fail{color:var(--bad)}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none}
.q p{margin:0 0 6px;font-weight:600}
.opt{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt.right{background:var(--good-soft);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-soft);color:var(--bad)}
.opt input{margin-top:6px}
.rec-wrap{margin-top:12px;padding:12px;border-radius:8px;background:var(--surface);border:1px dashed var(--speak)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;margin-left:10px}
.take{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.take audio{max-width:100%;height:36px}
.rec-note{font-size:13.5px;color:var(--muted);margin:8px 0 0}
.checks label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.model{margin-top:8px}
.model summary{cursor:pointer;font-weight:700;color:var(--speak)}
.model div{white-space:pre-line;margin-top:6px;padding:10px 12px;background:var(--surface);border-radius:8px}
.donebar{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-weight:700}
.callout{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{font-size:16px}
.card p{margin:4px 0;font-size:15px}
.tag-pass{color:var(--good);font-weight:700}
.tag-fail{color:var(--bad);font-weight:700}
.tag-mid{color:var(--accent);font-weight:700}
.tag-mute{color:var(--muted);font-weight:700}
.line{margin:6px 0}
.muted{color:var(--muted)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 28px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.wcard header{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.wcard h3{font-size:16px;margin:0;flex:1 1 180px}
.status{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.dots{display:flex;align-items:center;gap:6px;margin:6px 0 8px}
.dots span{font-size:13.5px;color:var(--muted);margin-left:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;display:inline-block}
.dot.on{background:var(--good);border-color:var(--good)}
.why{margin:6px 0;padding-left:20px;color:var(--bad);font-size:14.5px}
.warnline{margin:6px 0;color:var(--warn);font-size:14.5px;font-weight:700}
.notel{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px;display:block}
.notetext{margin:0;font-size:15px}
.saved{font-size:13px;color:var(--muted)}
.wcard textarea,.cfg input[type=date]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.cfg input[type=date]{width:auto}
.btn.is-sent{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn:disabled,input:disabled{opacity:.55;cursor:not-allowed}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:8px}
  nav.side .brand{display:none}
  nav.side a{min-width:104px;flex:0 0 auto}
  nav.side a small{display:none}
}
/* login gate, start-date dialog, toast */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gate[hidden]{display:none}
.shell[hidden]{display:none}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:400px}
.gate-card h1,.gate-card h2{font-family:var(--font-display);margin:4px 0 8px;line-height:1.2}
.gate-card h1{font-size:28px}.gate-card h2{font-size:22px}
.gate-card .eyebrow{font:700 12px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.gate-card input{font:inherit;font-size:18px;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:6px 0 12px}
.gate-card .btn{width:100%;padding:12px;font-size:16px}
.gate-card .msg{min-height:1.4em;color:var(--bad);margin:10px 0 0}
.gate-card .hint{color:var(--muted);font-size:14px;margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.sched{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.sched a{color:var(--accent)}
nav.side .logout{margin-top:10px;font:600 13px var(--font-body);background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;white-space:nowrap}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="off">
    <div class="eyebrow">Ebook tự học · A1 Empower</div>
    <h1>Tuấn Hưng · 4 tuần</h1>
    <p>Nhập mã của bạn để vào học hoặc xem tiến độ.</p>
    <label for="gate-code"><b>Mã đăng nhập</b></label>
    <input id="gate-code" type="text" autocapitalize="off" spellcheck="false" placeholder="Nhập mã của bạn">
    <button class="btn" type="submit">Vào</button>
    <p class="msg" id="gate-msg" role="alert"></p>
    <p class="hint">Hưng, phụ huynh và giáo viên mỗi người có một mã riêng. Chưa có mã thì hỏi giáo viên.</p>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Mục lục"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
const WEEKS=[];
let INTRO="";
const N=(h,html)=>({t:"note",h,html});
const V=(h,rows,intro)=>({t:"vocab",h,rows,intro});
const F=(h,intro,items)=>({t:"fill",h,intro,items});
const M=(h,intro,items,test)=>({t:"mcq",h,intro,items,test});
const S=(h,prompt,steps,model,checks)=>({t:"speak",h,prompt,steps,model,checks});
const D=(title,min,blocks)=>({title,min,blocks});
INTRO=`
<div class="hero">
  <div class="eyebrow">Ebook tự học · Tuấn Hưng · A1 Empower</div>
  <h1>4 tuần để chạm 80% vững vàng</h1>
  <div class="chips"><span class="chip">4 tuần</span><span class="chip">5 ngày học + 1 ngày kiểm tra mỗi tuần</span><span class="chip">35–45 phút mỗi ngày</span><span class="chip s">Ghi âm ngay trong trang</span></div>
</div>

<p><b>Mục tiêu:</b> đạt từ 80% trở lên (12/15 câu, 24/30 câu) ở bài kiểm tra mỗi tuần và 2 đề thi thử ở tuần 4.</p>

<h2 style="margin-top:28px">Cách học mỗi ngày</h2>
<p>Mở ngày cần học và làm lần lượt từ trên xuống:</p>
<ol>
  <li><b>Học:</b> đọc khung <b>Ghi nhớ</b>, hoặc <b>Bảng từ</b> ở ngày học từ vựng. Với bảng từ, bấm "Nghe" để nghe cách đọc, rồi bật "Che nghĩa" để tự kiểm tra.</li>
  <li><b>Làm bài:</b> làm bài điền từ và chọn đáp án, bấm "Kiểm tra". Câu sai thì sửa và kiểm tra lại, đừng chỉ xem đáp án.</li>
  <li><b>Nói và ghi âm:</b> làm theo khung tím ở cuối ngày, nghe lại và tự chấm theo danh sách.</li>
  <li><b>Tick "Đã học xong"</b> ở cuối ngày.</li>
</ol>
<p><b>Tuần 1–3:</b> ngày 5 là ngày ôn và luyện nói nhiều hơn, ngày 6 là bài kiểm tra 15 câu (cần đúng 12 câu). <b>Tuần 4:</b> thi thử 30 câu ở ngày 2 và ngày 4.</p>
<div class="callout"><b>Làm chậm:</b> quiz 20 câu cần ít nhất 4 phút. Kiểm tra chính tả trước khi nộp.</div>

<h2 style="margin-top:28px">Cách ghi âm</h2>
<ul>
  <li>Bấm "Bắt đầu ghi âm", cho phép dùng micro. Dừng, nghe lại, rồi bấm "Tải về" để gửi cho thầy/cô.</li>
  <li>Không ghi được thì dùng app ghi âm trên điện thoại hoặc voice note Zalo.</li>
  <li>Bản ghi mất khi đóng trang, nhớ tải về trước.</li>
</ul>
`;
WEEKS.push({
n:1, title:"Quá khứ: was/were, did và kỳ nghỉ",
sub:"Quá khứ của be và quá khứ đơn",
why:"Các câu <i>He ___ home yesterday</i>, <i>Where ___ you go on holiday?</i>, <i>What ___ the weather like?</i> và từ pagoda, holiday, underground đã bị sai ở Unit 8–9.",
goals:["Dùng đúng was/were và did/didn't, không nói didn't went","Chia đúng quá khứ -ed và 20 động từ bất quy tắc","Viết đúng từ về địa điểm, kỳ nghỉ, thời tiết và kể về kỳ nghỉ 1 phút"],
days:[
D("Was / were",40,[
 N("Ghi nhớ",`<p><b>Be</b> ở quá khứ chỉ có hai dạng: <b>was</b> và <b>were</b>.</p>
 <div class="tablewrap"><table>
 <tr><th></th><th>I / he / she / it</th><th>you / we / they</th></tr>
 <tr><td>Khẳng định</td><td>I <b>was</b> at home.</td><td>They <b>were</b> at home.</td></tr>
 <tr><td>Phủ định</td><td>He <b>wasn't</b> (was not) tired.</td><td>We <b>weren't</b> (were not) tired.</td></tr>
 <tr><td>Câu hỏi</td><td><b>Was</b> she at work?</td><td><b>Were</b> you at work?</td></tr>
 <tr><td>Trả lời ngắn</td><td>Yes, she <b>was</b>. / No, she <b>wasn't</b>.</td><td>Yes, we <b>were</b>. / No, we <b>weren't</b>.</td></tr>
 </table></div>
 <p><b>Từ chỉ thời gian đi cùng:</b> yesterday, last night, last week, last year, two days ago, in 2020, at six o'clock yesterday.</p>
 <p><b>Mẹo:</b> khi trong câu không có động từ chính nào khác, dùng was/were. Nói <i>I was tired</i>, không nói <i>I did tired</i>.</p>
 <p><b>Phát âm:</b> trong câu, <i>was</i> đọc nhẹ /wəz/, <i>were</i> đọc nhẹ /wə/. Khi trả lời ngắn mới nhấn mạnh: <i>Yes, I was.</i></p>`),
 F("Bài 1. Điền was hoặc were","Đọc cả câu rồi mới điền. Chú ý chủ ngữ.",[
  ["Yesterday I ___ at home.","was"],["They ___ in Hanoi last week.","were"],["She ___ tired last night.","was"],
  ["We ___ at the cinema two hours ago.","were"],["The hotel ___ very clean.","was"],["My parents ___ at work yesterday.","were"],
  ["It ___ cold on Sunday.","was"],["You ___ late for class yesterday.","were"],["The children ___ happy.","were"],["He ___ in Da Nang in 2023.","was"]]),
 M("Bài 2. Chọn đáp án đúng","",[
  ["___ you at home last night?","Were","Was","Are","Did"],["___ the food good?","Was","Were","Did","Is"],
  ["Where ___ your parents yesterday?","were","was","did","are"],["___ she in the office on Monday?","Was","Were","Did","Is"],
  ["Was he at school? No, he ___.","wasn't","weren't","didn't","isn't"],["Were they late? Yes, they ___.","were","was","did","are"],

}

  const [col,id]=it.path.split("/");
  if(col==="attempts"){STATE.attempts=STATE.attempts.filter(a=>a.id!==id);STATE.attempts.push(it.data)}
  else if(col==="config")STATE.config=it.data||{};
  else if(STATE[col])STATE[col][id]=it.data;
}
let flushing=null;
async function flush(){
  while(flushing)await flushing;
  flushing=(async()=>{
    for(;;){
      const batch=Q.get().slice(0,50);
      if(!batch.length)return true;
      let r;
      try{r=await api({action:"set",code:CTX.code,items:batch})}catch(e){return false}
      if(!r.ok){if(r.error==="code")logout("Mã đăng nhập đã thay đổi. Hãy nhập mã mới.");return false}
      const sent=new Set(batch.map(x=>x.path+"|"+JSON.stringify(x.data)));
      Q.set(Q.get().filter(x=>!sent.has(x.path+"|"+JSON.stringify(x.data))));
    }
  })();
  const ok=await flushing;flushing=null;
  if(CTX.online){
    if(!ok&&CTX.status!=="loading")CTX.status="offline";
    else if(ok&&CTX.status==="offline")CTX.status="ok";
    const b=$("#banner");if(b)b.innerHTML=bannerHTML();
  }
  return ok;
}
function dbSet(path,data){
  if(!CTX.online)return Promise.resolve(false);
  const q=Q.get().filter(x=>x.path!==path);q.push({path,data});Q.set(q);
  saveCache();
  return flush();
}
const isDone=(n,i)=>!!(STATE.days[dayId(n,i)]&&STATE.days[dayId(n,i)].done);
function setDone(n,i,v){
  const rec={w:n,d:i,done:v,at:new Date().toISOString()};
  STATE.days[dayId(n,i)]=rec;
  if(CTX.online)dbSet("days/"+dayId(n,i),rec);else LS.set("th4:d:"+dayId(n,i),v?"1":"0");
}
function addAttempt(a){
  STATE.attempts.push(a);
  if(CTX.online)dbSet("attempts/"+a.id,a);else LS.set("th4:attempts",JSON.stringify(STATE.attempts));
}
function setSpeak(id,rec){
  STATE.speaking[id]=rec;
  if(CTX.online)dbSet("speaking/"+id,rec);else LS.set("th4:speak",JSON.stringify(STATE.speaking));
}
function scoreOf(t){
  const a=STATE.attempts.filter(x=>x.test===t).sort((p,q)=>p.at<q.at?-1:1);
  if(!a.length)return null;
  const best=Math.max(...a.map(x=>x.correct));
  return {first:a[0].correct,best,last:a[a.length-1].correct,total:a[a.length-1].total,n:a.length};
}

function weekTests(w){return w.n===4?["mockA","mockB"]:["w"+w.n]}
function speakIds(w){

}
function weekProgress(w){
  let done=0;w.days.forEach((d,i)=>{if(isDone(w.n,i+1))done++});

function renderWeek(w){

    const blocks=d.blocks.map((b,bi)=>rBlock(b,`w${w.n}d${di+1}b${bi+1}`)).join("");

}

/* ----- observer dashboard ----- */
function weekSummary(w){
  const total=w.days.length;
  let done=0;w.days.forEach((d,i)=>{if(isDone(w.n,i+1))done++});
  const tests=weekTests(w).map(t=>({id:t,s:scoreOf(t)}));
  const sids=speakIds(w);
  const sent=sids.filter(id=>STATE.speaking[id]&&STATE.speaking[id].sent).length;
  const needSent=Math.ceil(sids.length*0.6);
  const attempts=STATE.attempts.filter(a=>weekTests(w).includes(a.test));
  const fast=attempts.some(a=>a.seconds>0&&a.seconds<a.total*12);
  const touched=[];
  w.days.forEach((d,i)=>{const r=STATE.days[dayId(w.n,i+1)];if(r&&r.at)touched.push(r.at)});
  attempts.forEach(a=>touched.push(a.at));
  sids.forEach(id=>{const r=STATE.speaking[id];if(r&&r.at)touched.push(r.at)});
  touched.sort();
  const started=done>0||attempts.length>0||sent>0;
  const reasons=[];
  if(done<total-1)reasons.push(`Mới học ${done}/${total} ngày, cần ít nhất ${total-1}`);
  tests.forEach(t=>{
    if(!t.s)reasons.push(`Chưa làm ${t.id==="mockA"?"đề thi thử A":t.id==="mockB"?"đề thi thử B":"bài kiểm tra tuần"}`);
    else if(t.s.first/t.s.total<PASS)reasons.push(`${t.id==="mockA"?"Đề A":t.id==="mockB"?"Đề B":"Bài kiểm tra"}: lần đầu ${Math.round(t.s.first/t.s.total*100)}%, chưa đạt 80%`);
  });
  if(sent<needSent)reasons.push(`Bài nói đã gửi ${sent}/${sids.length}, cần ít nhất ${needSent}`);
  const testTaken=tests.some(t=>t.s);
  let status;
  if(!started)status="none";
  else if(!reasons.length)status="pass";
  else if(testTaken||done===total)status="fail";
  else status="going";
  // schedule
  let late=false,future=false;
  const cw=currentWeek();
  if(cw!=null){
    if(w.n>cw&&!started)future=true;
    if(w.n<cw&&status!=="pass")late=true;
  }
  return {total,done,tests,sids,sent,needSent,attempts,fast,last:touched.length?touched[touched.length-1]:null,started,reasons,status,late,future};
}
/* lịch: mỗi tuần là 6 ngày liên tiếp tính từ ngày bắt đầu, không theo thứ trong tuần */
function schedPos(){
  const s=STATE.config&&STATE.config.start;
  if(!s)return null;
  const t=new Date(s+"T00:00:00");
  if(isNaN(t))return null;
  const n=new Date();
  const idx=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-t)/86400000);
  return {idx,w:Math.floor(idx/6)+1,d:idx%6+1};
}
function currentWeek(){
  const p=schedPos();
  if(!p)return null;
  return p.idx<0?0:Math.min(WEEKS.length+1,p.w);
}
const fmtDay=s=>{const [y,m,d]=String(s).split("-");return d&&m?`${d}/${m}/${y}`:s};
function schedHTML(){
  const p=schedPos();
  if(!p)return "";
  let t;
  if(p.idx<0)t=`Chưa tới ngày bắt đầu (${fmtDay(STATE.config.start)}).`;
  else if(p.w>WEEKS.length)t=`Đã hết ${WEEKS.length} tuần theo lịch (bắt đầu ${fmtDay(STATE.config.start)}).`;
  else t=`Hôm nay theo lịch: <a href="#w${p.w}"><b>Tuần ${p.w} · Ngày ${p.d}</b></a> (bắt đầu ${fmtDay(STATE.config.start)}).`;
  return `<p class="sched">${t}</p>`;
}
const ROLE_NAME={student:"Hưng",parent:"Phụ huynh",teacher:"Giáo viên"};
function roleLabel(){
  if(!CTX.online)return "Tiến độ của Hưng";

const STATUS_UI={
  pass:["Đạt tuần","tag-pass"],fail:["Chưa đạt","tag-fail"],going:["Đang học","tag-mid"],none:["Chưa bắt đầu","tag-mute"]
};
function renderTracker(){
  const sums=WEEKS.map(w=>({w,s:weekSummary(w)}));
  const passed=sums.filter(x=>x.s.status==="pass").length;
  const cw=currentWeek();
  const late=sums.some(x=>x.s.late);
  const a=scoreOf("mockA"),b=scoreOf("mockB");
  const mockOk=a&&b&&a.first/a.total>=PASS&&b.first/b.total>=PASS;
  const sched=cw==null?"Hưng chưa chọn ngày bắt đầu, nên chưa so sánh được với lịch.":cw===0?"Chưa tới ngày bắt đầu.":cw>WEEKS.length?`Đã hết ${WEEKS.length} tuần theo lịch.`:(late?"Có tuần đang chậm so với lịch.":"Chưa thấy tuần nào chậm so với lịch.");
  const cards=sums.map(({w,s})=>{
    const ui=s.future?["Chưa tới lịch","tag-mute"]:(s.status==="going"&&s.late?["Chậm lịch","tag-fail"]:STATUS_UI[s.status]);
    const dots=w.days.map((d,i)=>`<i class="dot${isDone(w.n,i+1)?" on":""}" title="Ngày ${i+1}"></i>`).join("");
    const tl=s.tests.map(t=>t.s?`${t.id==="mockA"?"Đề A":t.id==="mockB"?"Đề B":"Kiểm tra"}: lần đầu <b>${t.s.first}/${t.s.total}</b> (${Math.round(t.s.first/t.s.total*100)}%) · cao nhất ${t.s.best}/${t.s.total} · ${t.s.n} lần làm`:`${t.id==="mockA"?"Đề A":t.id==="mockB"?"Đề B":"Kiểm tra"}: chưa làm`).join("<br>");
    const reasons=(s.status==="fail"||s.status==="going"||s.late)&&s.reasons.length?`<ul class="why">${s.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:"";
    const fast=s.fast?`<p class="warnline">Có lần làm bài kiểm tra quá nhanh (dưới 12 giây mỗi câu).</p>`:"";
    const note=STATE.notes["w"+w.n];
    let noteHTML="";
    if(CTX.online){
      if(CTX.canEdit)noteHTML=`<label class="notel" for="note-${w.n}">Nhận xét của giáo viên</label><textarea id="note-${w.n}" rows="2" placeholder="Viết nhận xét ngắn cho tuần này">${esc(note?note.text:"")}</textarea><div class="actions"><button class="btn sm" data-act="save-note" data-w="${w.n}">Lưu nhận xét</button><span class="saved" id="saved-${w.n}">${note&&note.at?"Lưu lúc "+fmtDate(note.at):""}</span></div>`;
      else noteHTML=`<p class="notel">Nhận xét của giáo viên</p><p class="notetext">${note&&note.text?esc(note.text):"Chưa có nhận xét."}</p>${note&&note.at?`<p class="saved">${fmtDate(note.at)}</p>`:""}`;
    }
    return `<article class="wcard"><header><h3>Tuần ${w.n} · ${esc(w.title)}</h3><span class="status ${ui[1]}">${ui[0]}</span></header>
    <div class="dots" aria-label="${s.done}/${s.total} ngày đã học">${dots}<span>${s.done}/${s.total} ngày</span></div>
    <p class="line">${tl}</p>
    <p class="line">Bài nói đã gửi: <b>${s.sent}/${s.sids.length}</b></p>
    <p class="line muted">${s.last?"Hoạt động gần nhất: "+fmtDate(s.last):"Chưa có hoạt động"}</p>
    ${reasons}${fast}${noteHTML}</article>`;
  }).join("");
  const att=STATE.attempts.slice().sort((p,q)=>p.at<q.at?1:-1).slice(0,15).map(x=>{
    const pct=Math.round(x.correct/x.total*100);
    const name=x.test==="mockA"?"Thi thử A":x.test==="mockB"?"Thi thử B":"Tuần "+x.test.slice(1);
    const fastF=x.seconds>0&&x.seconds<x.total*12;
    return `<tr><td>${fmtDate(x.at)}</td><td>${name}</td><td>${x.correct}/${x.total} (${pct}%)</td><td>${pct>=80?'<span class="tag-pass">Đạt</span>':'<span class="tag-fail">Chưa đạt</span>'}</td><td>${x.seconds?fmtSec(x.seconds):"—"}${fastF?' <span class="tag-fail">quá nhanh</span>':""}</td></tr>`;
  }).join("");
  const cfg=(CTX.canEdit||!CTX.online)?(STATE.config.start||CTX.canEdit?`<div class="cfg"><label for="cfg-start">Ngày bắt đầu học (mỗi tuần 6 ngày tính từ ngày này)</label><input type="date" id="cfg-start" value="${esc(STATE.config.start||"")}"><button class="btn sm" data-act="save-start">Lưu</button><span class="saved" id="saved-start"></span></div>`:""):`<p class="line muted">Ngày bắt đầu: ${STATE.config.start?esc(fmtDay(STATE.config.start)):"chưa chọn"}</p>`;
  const localNote=!CTX.online?`<div class="callout">Điểm và tiến độ được lưu trong trình duyệt đang dùng. Hãy luôn học trên cùng một máy và cùng một trình duyệt để không mất tiến độ.</div>`:"";
  return `<div class="hero"><div class="eyebrow">${esc(roleLabel())}</div><h1>Sổ điểm</h1>
  <p class="lede">Một tuần được tính là <b>đạt</b> khi Hưng học ít nhất 5 trong 6 ngày, <b>lần làm đầu tiên</b> của bài kiểm tra từ 80% trở lên, và đã gửi ít nhất 60% số bài nói.</p></div>
  <div id="banner">${bannerHTML()}</div>${localNote}
  <div class="sumgrid">
   <div class="stat"><b>${passed}/${WEEKS.length}</b><span>tuần đạt</span></div>
   <div class="stat"><b>${mockOk?"Có":"Chưa"}</b><span>cả hai đề thi thử đạt 80%</span></div>
   <div class="stat"><b>${STATE.attempts.length}</b><span>lượt làm bài kiểm tra</span></div>
  </div>
  <p class="line">${esc(sched)}</p>${cfg}
  <h2 style="margin-top:22px">Theo từng tuần</h2><div class="wgrid">${cards}</div>
  <h2 style="margin-top:22px">15 lượt làm bài gần nhất</h2>
  ${att?`<div class="tablewrap"><table><tr><th>Thời điểm</th><th>Bài</th><th>Điểm</th><th>Kết quả</th><th>Thời gian làm</th></tr>${att}</table></div>`:`<p class="line muted">Chưa có lượt làm bài kiểm tra nào.</p>`}`;
}

  const link=(id,t,s,sub,pct)=>`<a href="#${id}"${cur===id?' aria-current="page"':""}><b>${t}</b><span>${s||""}</span>${sub?`<small>${sub}</small>`:""}${pct!=null?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}</a>`;
  $("#side").innerHTML=`<p class="brand"><small>Ebook tự học</small>Tuấn Hưng · A1</p>`+
    link("intro","Bắt đầu","","Kế hoạch 4 tuần")+
    WEEKS.map(w=>link("w"+w.n,"Tuần "+w.n,weekProgress(w)+"%",esc(w.title),weekProgress(w))).join("")+
    link("tracker","Sổ điểm","","Kết quả và tiến độ")+
    (CTX.online?`<button class="logout" type="button" data-act="logout">Đăng xuất · ${ROLE_NAME[CTX.role]}</button>`:"");
}

/* keep checkboxes / buttons in sync with state without re-rendering the page */
function syncUI(){
  $$("input[data-act=day-done]").forEach(el=>{
    const v=isDone(+el.dataset.w,+el.dataset.d);
    el.checked=v;el.closest("details.day").classList.toggle("done",v);
    el.disabled=!CTX.canWrite;
  });
  $$(".block.speak").forEach(sec=>{
    const r=STATE.speaking[sec.id];
    const btn=$(".sent",sec),info=$(".sentinfo",sec);
    if(!btn)return;
    const sent=!!(r&&r.sent);
    btn.textContent=sent?"Đã gửi. Bấm để bỏ đánh dấu":"Đánh dấu: đã ghi âm và gửi cho giáo viên";
    btn.classList.toggle("is-sent",sent);
    btn.disabled=!CTX.canWrite;
    info.textContent=sent&&r.at?`Đã gửi lúc ${fmtDate(r.at)}${r.total?`, tự chấm ${r.checks}/${r.total} mục`:""}`:"";
  });
}
function applyRole(){
  const b=$("#banner");if(b)b.innerHTML=bannerHTML();
  syncUI();
}
function onData(){
  renderNav(curPage());
  syncUI();
  const b=$("#banner");if(b)b.innerHTML=bannerHTML();
  if(curPage()==="tracker"){
    const ae=document.activeElement;
    if(!(ae&&ae.closest&&ae.closest("#main")&&ae.matches("textarea,input")))renderPage("tracker");
  }
}

/* ---------- recorder (local file only) ---------- */
let activeRec=null;
function stopActive(){if(activeRec&&activeRec.mr.state!=="inactive")activeRec.mr.stop()}
async function toggleRec(btn){
  const wrap=btn.closest(".rec-wrap");
  if(activeRec&&activeRec.wrap===wrap){stopActive();return}
  if(activeRec)stopActive();
  const note=$(".rec-note",wrap);
  if(!navigator.mediaDevices||!window.MediaRecorder){note.textContent="Trình duyệt này không hỗ trợ ghi âm. Hãy ghi bằng ứng dụng ghi âm trên điện thoại hoặc voice note Zalo rồi gửi lại.";return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){note.textContent="Không dùng được micro. Hãy cho phép micro trong trình duyệt, hoặc ghi bằng điện thoại rồi gửi lại.";return}
  const mr=new MediaRecorder(stream);
  const chunks=[];const start=Date.now();
  const timer=$(".timer",wrap);
  const tick=setInterval(()=>{const s=Math.floor((Date.now()-start)/1000);timer.textContent=fmtSec(s)},250);
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    clearInterval(tick);stream.getTracks().forEach(t=>t.stop());
    btn.textContent="Bắt đầu ghi âm";btn.classList.remove("on");
    const type=mr.mimeType||"audio/webm";
    const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";
    const blob=new Blob(chunks,{type});
    const url=URL.createObjectURL(blob);
    const takes=$(".takes",wrap);
    const n=takes.children.length+1;
    const name=`tuan-hung-${wrap.dataset.rec}-lan${n}.${ext}`;
    const div=document.createElement("div");div.className="take";
    div.innerHTML=`<span><b>Lần ${n}</b></span><audio controls src="${url}"></audio><a class="btn ghost sm" href="${url}" download="${name}">Tải về</a><button class="btn ghost sm" data-act="del-take">Xóa</button>`;
    takes.appendChild(div);
    activeRec=null;
  };
  mr.start();
  activeRec={mr,wrap};
  btn.textContent="Dừng ghi âm";btn.classList.add("on");
}

/* ---------- checking ---------- */
function checkFill(sec){
  let ok=0;const inputs=$$("input.gap",sec);
  inputs.forEach(inp=>{
    const answers=inp.dataset.a.split("|").map(norm);
    const good=answers.includes(norm(inp.value));
    inp.classList.toggle("ok",good);inp.classList.toggle("bad",!good);
    const fb=inp.closest("li").querySelector(".fb");
    fb.className="fb "+(good?"ok":"bad");
    fb.textContent=good?"Đúng":(inp.value.trim()?"Chưa đúng, thử lại hoặc bấm Xem đáp án":"Chưa điền");
    if(good)ok++;
  });
  const sc=$(".score",sec);sc.textContent=`${ok}/${inputs.length} câu đúng`;
  sc.className="score "+(ok/inputs.length>=0.8?"pass":"fail");
}
function showFill(sec){
  $$("input.gap",sec).forEach(inp=>{
    const fb=inp.closest("li").querySelector(".fb");
    fb.className="fb";fb.textContent="Đáp án: "+inp.dataset.a.split("|").join(" hoặc ");
  });
}
function resetFill(sec){
  $$("input.gap",sec).forEach(inp=>{inp.value="";inp.classList.remove("ok","bad");const fb=inp.closest("li").querySelector(".fb");fb.textContent="";fb.className="fb"});
  const sc=$(".score",sec);sc.textContent="";sc.className="score";
}
function checkMcq(sec){
  const qs=$$(".q",sec);let ok=0;
  if(sec.dataset.test&&sec.dataset.recorded!=="1"){
    const left=qs.filter(q=>!$("input:checked",q)).length;
    if(left&&!confirm(`Còn ${left} câu chưa làm, vẫn nộp?`))return;
  }
  qs.forEach(q=>{
    const correct=q.dataset.correct;
    const sel=$("input:checked",q);
    $$(".opt",q).forEach(o=>{o.classList.remove("right","wrong")});
    $$(".opt",q).forEach(o=>{
      const v=$("input",o).value;
      if(v===correct)o.classList.add("right");
      else if(sel&&v===sel.value)o.classList.add("wrong");
    });
    const fb=$(".fb",q);
    if(sel&&sel.value===correct){ok++;fb.textContent="";}
    else{fb.className="fb bad";fb.textContent=sel?"Đáp án đúng: "+correct:"Bạn chưa chọn. Đáp án đúng: "+correct}
  });
  const sc=$(".score",sec);
  const pct=Math.round(ok/qs.length*100);
  sc.textContent=`${ok}/${qs.length} câu đúng (${pct}%) · ${pct>=80?"Đạt":"Chưa đạt 80%"}`;
  sc.className="score "+(pct>=80?"pass":"fail");
  const t=sec.dataset.test;
  if(t&&sec.dataset.recorded!=="1"&&CTX.canWrite){
    sec.dataset.recorded="1";
    const secs=sec.dataset.t0?Math.round((Date.now()-(+sec.dataset.t0))/1000):0;
    const at=new Date().toISOString();
    addAttempt({id:t+"_"+Date.now(),test:t,correct:ok,total:qs.length,seconds:secs,at});
    renderNav(curPage());
  }
}
function resetMcq(sec){
  $$(".q",sec).forEach(q=>{$$("input",q).forEach(i=>i.checked=false);$$(".opt",q).forEach(o=>o.classList.remove("right","wrong"));const fb=$(".fb",q);fb.textContent="";fb.className="fb"});
  const sc=$(".score",sec);sc.textContent="";sc.className="score";
  delete sec.dataset.t0;delete sec.dataset.recorded;
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act;
  const sec=el.closest(".block");
  if(act==="say")say(el.dataset.say);
  else if(act==="check-fill")checkFill(sec);
  else if(act==="show-fill")showFill(sec);
  else if(act==="reset-fill")resetFill(sec);
  else if(act==="check-mcq")checkMcq(sec);
  else if(act==="reset-mcq")resetMcq(sec);
  else if(act==="rec")toggleRec(el);
  else if(act==="del-take"){const t=el.closest(".take");const a=$("audio",t);if(a&&a.src)URL.revokeObjectURL(a.src);t.remove()}
  else if(act==="sent"){
    if(!CTX.canWrite)return;
    const id=sec.id;const m=/^w(\d+)d(\d+)b/.exec(id)||[];
    const cur=STATE.speaking[id];
    const sent=!(cur&&cur.sent);
    const checks=$$(".checks input:checked",sec).length,total=$$(".checks input",sec).length;
    setSpeak(id,{w:+m[1]||0,d:+m[2]||0,title:el.dataset.title,sent,at:new Date().toISOString(),checks,total});
    syncUI();renderNav(curPage());
  }
  else if(act==="save-note"){
    const n=+el.dataset.w;const ta=$("#note-"+n);
    const rec={w:n,text:ta.value.trim(),at:new Date().toISOString()};
    STATE.notes["w"+n]=rec;
    const ok=await dbSet("notes/w"+n,rec);
    const s=$("#saved-"+n);if(s)s.textContent=ok?"Đã lưu "+fmtDate(rec.at):"Chưa gửi được, trang sẽ tự gửi lại khi có mạng.";
  }
  else if(act==="save-start"){
    const v=$("#cfg-start").value;
    if(!v)return;
    const ok=await saveStart(v);
    const s=$("#saved-start");if(s)s.textContent=ok?"Đã lưu":"Chưa gửi được, trang sẽ tự gửi lại khi có mạng.";
    renderPage("tracker");
  }
  else if(act==="logout"){
    const n=Q.get().length;
    if(n&&CTX.canWrite&&!confirm(`Còn ${n} kết quả chưa gửi lên sổ điểm chung. Đăng xuất bây giờ sẽ mất các kết quả này. Vẫn đăng xuất?`))return;
    logout("");
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="hide-vi")el.closest(".vocab").classList.toggle("hide-vi",el.checked);
  if(el.dataset.act==="day-done"){
    if(!CTX.canWrite){el.checked=!el.checked;return}
    setDone(+el.dataset.w,+el.dataset.d,el.checked);
    el.closest("details.day").classList.toggle("done",el.checked);
    renderNav(curPage());
  }
  if(el.type==="radio"){
    const sec=el.closest("[data-kind=mcq]");
    if(sec&&!sec.dataset.t0)sec.dataset.t0=String(Date.now());
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input.gap")){
    const all=$$("input.gap",e.target.closest(".block"));const i=all.indexOf(e.target);
    if(i>=0&&i<all.length-1)all[i+1].focus();else checkFill(e.target.closest(".block"));
  }
});
window.addEventListener("hashchange",()=>renderPage(curPage()));

/* ---------- start date (chosen by Hưng on first open) ---------- */
async function saveStart(v){
  STATE.config={...STATE.config,start:v};
  if(CTX.online)return dbSet("config/main",STATE.config);
  LS.set("th4:config",JSON.stringify(STATE.config));return true;
}
function maybeAskStart(){
  if(!CTX.canWrite||CTX.canEdit||STATE.config.start||$("#startdlg"))return;
  if(CTX.online&&CTX.status!=="ok")return;
  const n=new Date();
  const today=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  const d=document.createElement("div");
  d.className="gate";d.id="startdlg";
  d.innerHTML=`<form class="gate-card"><div class="eyebrow">Chào Hưng</div><h2>Chọn ngày bắt đầu học</h2>
  <p>Ngày học tiếp theo tự tính từ ngày này. Cứ 6 ngày liên tiếp là xong 1 tuần, không phụ thuộc thứ trong tuần.</p>
  <label for="start-date"><b>Ngày bắt đầu</b></label><input type="date" id="start-date" value="${today}" required>
  <button class="btn" type="submit">Bắt đầu học</button></form>`;
  document.body.appendChild(d);
  d.querySelector("form").addEventListener("submit",async ev=>{
    ev.preventDefault();
    const v=$("#start-date").value;if(!v)return;
    d.remove();
    renderPage(curPage());
    await saveStart(v);
    onData();
  });
}

/* ---------- login with a code (shared mode) ---------- */
function setRole(role){
  CTX.role=role;CTX.online=true;
  CTX.canWrite=role==="student";CTX.canEdit=role==="teacher";
}
async function refresh(){
  try{
    const r=await api({action:"load",code:CTX.code});
    if(!r.ok){if(r.error==="code"){logout("Mã đăng nhập đã thay đổi. Hãy nhập mã mới.");return}throw new Error(r.error)}
    if(r.role!==CTX.role){setRole(r.role);LS.set("th4:role",r.role)}
    const d=r.data||{};
    STATE.days=d.days||{};STATE.attempts=Object.values(d.attempts||{});STATE.speaking=d.speaking||{};
    STATE.notes=d.notes||{};STATE.config=(d.config&&d.config.main)||{};
    if(CTX.canWrite){migrateLocal();Q.get().forEach(applyItem)}
    saveCache();
    CTX.status="ok";
    if(CTX.canWrite&&Q.get().length)flush();
  }catch(e){
    CTX.status="offline";
  }
  onData();
  maybeAskStart();
}
/* progress saved on this device before logging in is sent to the sheet once */
function migrateLocal(){
  if(LS.get("th4:migrated")==="1")return;
  const q=Q.get();
  WEEKS.forEach(w=>w.days.forEach((d,i)=>{
    const id=dayId(w.n,i+1);
    if(LS.get("th4:d:"+id)==="1"&&!STATE.days[id])q.push({path:"days/"+id,data:{w:w.n,d:i+1,done:true,at:new Date().toISOString()}});
  }));
  try{JSON.parse(LS.get("th4:attempts")||"[]").forEach(a=>{if(a&&a.id&&!STATE.attempts.some(x=>x.id===a.id))q.push({path:"attempts/"+a.id,data:a})})}catch(e){}
  try{const sp=JSON.parse(LS.get("th4:speak")||"{}");Object.keys(sp).forEach(id=>{if(!STATE.speaking[id])q.push({path:"speaking/"+id,data:sp[id]})})}catch(e){}
  try{const c=JSON.parse(LS.get("th4:config")||"{}");if(c.start&&!STATE.config.start)q.push({path:"config/main",data:c})}catch(e){}
  Q.set(q);LS.set("th4:migrated","1");
}
function logout(msg){
  ["th4:code","th4:role","th4:cache"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  if(!msg)try{localStorage.removeItem("th4:queue")}catch(e){}
  CTX.online=false;CTX.code=null;CTX.role=null;
  STATE.days={};STATE.attempts=[];STATE.speaking={};STATE.notes={};STATE.config={};
  const sd=$("#startdlg");if(sd)sd.remove();
  showGate(msg);
}
function showGate(msg){
  $("#gate").hidden=false;$(".shell").hidden=true;
  $("#gate-msg").textContent=msg||"";
  setTimeout(()=>$("#gate-code").focus(),50);
}
$("#gate-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const code=$("#gate-code").value.trim();
  const msg=$("#gate-msg"),btn=$("#gate-form button");
  if(!code){msg.textContent="Hãy nhập mã.";return}
  btn.disabled=true;msg.textContent="Đang kiểm tra…";
  let r=null;
  try{r=await api({action:"login",code})}catch(err){}
  btn.disabled=false;
  if(!r){msg.textContent="Không kết nối được. Kiểm tra mạng rồi thử lại.";return}
  if(!r.ok){msg.textContent="Mã không đúng. Kiểm tra lại hoặc hỏi giáo viên.";return}
  const prev=LS.get("th4:lastrole");
  if(r.role!=="student"||(prev&&prev!=="student"))Q.set([]);
  LS.set("th4:code",code);LS.set("th4:role",r.role);LS.set("th4:lastrole",r.role);
  $("#gate-code").value="";msg.textContent="";
  startShared(code,r.role,true);
});
function startShared(code,role,fresh){
  CTX.code=code;setRole(role);
  loadCache();if(CTX.canWrite)Q.get().forEach(applyItem);
  CTX.status="loading";
  $("#gate").hidden=true;$(".shell").hidden=false;
  if(role!=="student"&&(fresh||!location.hash))history.replaceState(null,"","#tracker");
  renderPage(curPage());
  refresh();
}
function boot(){
  if(!CTX.remote){loadLocal();renderPage(curPage());maybeAskStart();return}
  const code=LS.get("th4:code"),role=LS.get("th4:role");
  if(!code||!role){showGate("");return}
  startShared(code,role);
}
setInterval(()=>{
  if(!CTX.online||document.visibilityState!=="visible")return;
  if(CTX.canWrite){if(Q.get().length)flush()}
  else refresh();
},60000);
document.addEventListener("visibilitychange",()=>{if(CTX.online&&document.visibilityState==="visible")refresh()});
window.addEventListener("online",()=>{if(CTX.online)flush()});
boot();
</script>
